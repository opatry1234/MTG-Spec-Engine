name: Volume capture (TCGplayer chart)

# Self-chaining sweep of the full ~32k playable pool for price + quantity_sold.
# Each run scrapes ONE ~150-card slice, then (after a short delay) re-dispatches the
# NEXT slice via the API — a continuous chain that does NOT depend on GitHub's flaky
# cron scheduler. Every link runs on a fresh runner (fresh IP), so the per-IP throttle
# never accumulates across links. Full sweep in ~1.5 days, then it keeps cycling to
# refresh. A 2-hourly cron is only a safety restarter if the chain ever breaks.
#
# Chaining requires a PAT secret CHAIN_PAT (Actions: read/write on this repo) — the
# default GITHUB_TOKEN is blocked from re-triggering workflows (recursion guard).
# Falls back to a single run (no chain) if CHAIN_PAT is absent.
on:
  workflow_dispatch:
    inputs:
      offset:
        description: "Slice start index (the chain passes the next; blank = time-based)"
        required: false
        default: ""
  schedule:
    - cron: "13 * * * *"   # hourly safety restarter (odd minute dodges :00 load)

permissions:
  actions: write   # re-dispatch the next link

concurrency:
  group: volume-capture
  cancel-in-progress: false   # links queue rather than overlap

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests

      - name: Capture price + volume slice (12-month backfill)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VOLUME_WATCHLIST_MAX: "150"
          VOLUME_WATCHLIST_OFFSET: ${{ github.event.inputs.offset }}
        # --seed pulls 12 months/card (backfill). Drop it for lighter refreshes once
        # the pool is fully swept.
        run: python ingest/snapshot_volume.py --seed

      # always(): a transient scrape failure (Scryfall hiccup, throttle) must not
      # kill the chain — dispatch the next link regardless. The hourly cron only
      # exists for runs cancelled mid-flight, where steps don't execute at all.
      # No offset passing: the scraper works the FRONTIER (unpinned cards first),
      # so duplicate chains spawned by the cron can't re-scrape covered slices.
      - name: Chain the next slice
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.CHAIN_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "No CHAIN_PAT secret — running un-chained (single slice). Add the PAT to enable the chain."
            exit 0
          fi
          sleep 300   # ~5-min spacing: polite, fresh runner next
          gh workflow run volume-capture.yml
          echo "Dispatched next frontier slice"
