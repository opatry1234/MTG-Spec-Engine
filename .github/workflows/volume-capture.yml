name: Volume capture (TCGplayer chart)

# Sweeps the full ~32k playable-card pool for price+quantity_sold, ~150 cards/run.
# The TCGplayer chart endpoint throttles (~150 before a 403), so one run covers one
# rolling slice; the slice advances with wall-clock time (see ingest/snapshot_volume.py).
# Every-15-min cadence → full sweep in ~2.3 days, then keeps the pool refreshed.
# GitHub runners rotate IPs, so each run effectively gets a fresh throttle budget;
# the job also stops cleanly on a 403, so a tight cadence can't break anything.
# (GitHub may skip some 15-min ticks under load — missed slices get caught next cycle.)
#
# NOTE: VOLUME_ROTATE_SECONDS (below) MUST match this interval, or two runs in the
# same rotation window re-scrape the same slice (no faster coverage).
on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes
  workflow_dispatch: {}      # manual run from the Actions tab

concurrency:
  group: volume-capture
  cancel-in-progress: false   # never interrupt an in-flight scrape

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests

      - name: Capture price + volume slice (12-month backfill)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VOLUME_WATCHLIST_MAX: "150"
          VOLUME_ROTATE_SECONDS: "900"   # must match the 15-min cron above
        # --seed pulls 12 months per card (history backfill). Once the pool is fully
        # swept, drop --seed for lighter incremental (month-range) refreshes.
        run: python ingest/snapshot_volume.py --seed
